<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in - NanoURL</title>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>
  <div class="auth-page">
    <div class="auth-card">
      <a href="/" class="brand">NanoURL</a>
      <h2>Log in</h2>
      <p class="sub">Use the email and password you signed up with.</p>

      <form id="loginForm">
        <div class="input-group">
          <label for="email">Email</label>
          <input type="email" id="email" class="input" required autocomplete="email">
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" class="input" required autocomplete="current-password">
            <button type="button" class="password-toggle" onclick="togglePassword()">Show</button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-full" id="loginBtn">Log in</button>
      </form>

      <div class="auth-footer">
        No account yet? <a href="/signup">Sign up</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>

</html>
