<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password required - NanoURL</title>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>
  <div class="auth-page">
    <div class="auth-card">
      <a href="/" class="brand">NanoURL</a>
      <h2>This link is password protected</h2>
      <p class="sub">Enter the password to continue.</p>

      <form method="GET" action="">
        <p class="form-error hidden" id="passwordError">Wrong password, try again.</p>
        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" class="input" required autofocus>
        </div>
        <button type="submit" class="btn btn-primary w-full">Continue</button>
      </form>
    </div>
  </div>

  <script>
    if (new URLSearchParams(window.location.search).has('password')) {
      document.getElementById('passwordError').classList.remove('hidden');
    }
  </script>
</body>

</html>
