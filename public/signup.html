<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up - NanoURL</title>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>
  <div class="auth-page">
    <div class="auth-card">
      <a href="/" class="brand">NanoURL</a>
      <h2>Create an account</h2>
      <p class="sub">Free plan, no card needed.</p>

      <form id="signupForm">
        <div class="input-group">
          <label for="displayName">Name</label>
          <input type="text" id="displayName" class="input" autocomplete="name">
        </div>

        <div class="input-group">
          <label for="email">Email</label>
          <input type="email" id="email" class="input" required autocomplete="email">
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" class="input" required minlength="8" autocomplete="new-password">
            <button type="button" class="password-toggle" onclick="togglePassword()">Show</button>
          </div>
          <small>At least 8 characters.</small>
        </div>

        <button type="submit" class="btn btn-primary w-full" id="signupBtn">Create account</button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="/login">Log in</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>

</html>
